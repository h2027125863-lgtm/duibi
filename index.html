<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>2022年自建住宅火灾比例 · 交互图</title>
  <style>
    :root {
      --orange: #c67e55;
      --blue: #648a9d;
      --base-house: #bfb9b4;
      --base-person: #aebec6;
      --number: #ede7e0;
    }
    :root[data-theme="light"] { --number: #41464a; }
    *,*::before,*::after { box-sizing: border-box; }
    html,body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: transparent !important;
    }
    body { display: flex; align-items: center; justify-content: center; overflow: hidden; }
    #stage {
      display: block;
      width: 100%;
      max-width: 1760px;
      aspect-ratio: 1760 / 700;
      background: transparent !important;
      cursor: pointer;
      touch-action: manipulation;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }
    #stage:focus-visible { outline: 1px dashed rgba(160,170,185,.5); outline-offset: -5px; }
    #visual {
      display:block;
      width:100%;
      height:100%;
      background:transparent !important;
      overflow:visible;
      user-select:none;
      -webkit-user-select:none;
    }
    .base-icon,.color-icon,.value {
      opacity:0;
      transform-box:fill-box;
      transform-origin:center center;
      will-change:opacity,transform;
    }
    .base-icon { transform:translateY(12px) scale(.94); }
    .color-icon { transform:translateY(5px) scale(.96); }
    .value { transform:translateY(9px); }
    .playing .base-icon {
      animation:appear .52s cubic-bezier(.18,.8,.3,1) both;
      animation-delay:var(--delay);
    }
    .playing .color-icon {
      animation:reveal .56s cubic-bezier(.2,.8,.25,1) both;
      animation-delay:var(--delay);
    }
    .playing .value {
      animation:rise .65s cubic-bezier(.2,.8,.3,1) both;
      animation-delay:var(--delay);
    }
    @keyframes appear {
      from {opacity:0;transform:translateY(12px) scale(.94)}
      to   {opacity:.78;transform:translateY(0) scale(1)}
    }
    @keyframes reveal {
      from {opacity:0;transform:translateY(5px) scale(.96)}
      to   {opacity:1;transform:translateY(0) scale(1)}
    }
    @keyframes rise {
      from {opacity:0;transform:translateY(9px)}
      to   {opacity:1;transform:translateY(0)}
    }
    #num-house,#num-person {
      font-family:Inter, "Helvetica Neue", Arial, sans-serif;
      font-weight:600;
      font-variant-numeric:tabular-nums;
      font-size:118px;
      letter-spacing:-4px;
      fill:var(--number);
      paint-order:stroke;
      stroke:rgba(12,19,27,.12);
      stroke-width:1.5px;
      stroke-linejoin:round;
    }
    @media (prefers-reduced-motion:reduce) {
      .playing .base-icon,.playing .color-icon,.playing .value {
        animation:none !important;
        opacity:1 !important;
        transform:none !important;
      }
      .playing .base-icon {opacity:.78 !important}
    }
  </style>
</head>
<body>
  <main id="stage" tabindex="0" role="button"
    aria-label="2022年自建住宅火灾占全国火灾起数的20.6%，相关死亡人数占全国火灾死亡人数的39.1%。鼠标移入或点击播放图标动画。">
    <svg id="visual" viewBox="0 0 1760 700" preserveAspectRatio="xMidYMid meet"
         xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <!-- 几何房屋：无拟人化、无卡通描边，门口直接镂空 -->
        <symbol id="house" viewBox="0 0 100 105">
          <path fill="currentColor" d="M47.8 7.5 Q50 5.4 52.2 7.5 L96 46.5 Q100 50 96 55 L87 55 L87 92.5 Q87 97 82.5 97 L64 97 L64 65 L36 65 L36 97 L17.5 97 Q13 97 13 92.5 L13 55 L4 55 Q0 50 4 46.5 Z" />
        </symbol>
        <!-- 中性信息图形的人形剪影 -->
        <symbol id="person" viewBox="0 0 100 170">
          <circle cx="50" cy="19" r="17.5" fill="currentColor"/>
          <path fill="currentColor" d="M35 43 H65 C78 43 82 51 83 62 L87 98 C88 105 84 109 79 109 C73 109 71 105 70 100 L68.5 75 L67 75 L67 155 C67 163 61 167 54 164 C51 163 49 159 49 153 L49 115 L47 115 L47 153 C47 161 44 165 38 165 C31 165 29 160 29 153 L29 75 L27.5 75 L26 100 C25 106 21 109 16 109 C11 109 8 105 9 98 L13 62 C14 51 22 43 35 43 Z" />
        </symbol>
      </defs>
      <g id="house-row"></g>
      <g id="person-row"></g>
      <g id="values">
        <text class="value" id="num-house" x="1325" y="259" style="--delay:4.30s">20.6%</text>
        <text class="value" id="num-person" x="1325" y="543" style="--delay:4.65s">39.1%</text>
      </g>
    </svg>
  </main>
<script>
(() => {
  'use strict';
  const SVG_NS='http://www.w3.org/2000/svg';
  const stage=document.querySelector('#stage');
  const houseRow=document.querySelector('#house-row');
  const personRow=document.querySelector('#person-row');
  const svg=document.querySelector('#visual');
  const topNumber=document.querySelector('#num-house');
  const bottomNumber=document.querySelector('#num-person');

  // 10个图标=100%。前2个房屋及第3个的6%，前3个人及第4个的91%。
  // 这种局部上色避免把20.6%误画成20%、把39.1%误画成40%。
  const DATA=[
    {group:houseRow,symbol:'house',x:88,y:151,w:89,h:94,spacing:115,
     total:20.6,base:'#bfb9b4',filled:'#c67e55',phase:2.33},
    {group:personRow,symbol:'person',x:98,y:381,w:79,h:158,spacing:115,
     total:39.1,base:'#aebec6',filled:'#648a9d',phase:2.49}
  ];
  const el=(tag,attrs={})=>{
    const node=document.createElementNS(SVG_NS,tag);
    for(const [key,val] of Object.entries(attrs)) node.setAttribute(key,String(val));
    return node;
  };
  DATA.forEach((d,rowIndex)=>{
    for(let i=0;i<10;i++){
      const x=d.x+i*d.spacing;
      const frac=Math.min(1,Math.max(0,d.total/10-i));
      const base=el('use',{
        href:'#'+d.symbol,x,y:d.y,width:d.w,height:d.h,
        class:'base-icon',style:`--delay:${(0.14 + i*0.115 + rowIndex*0.16).toFixed(3)}s`,
        color:d.base
      });
      d.group.append(base);
      if(frac>0){
        const overlay=el('use',{
          href:'#'+d.symbol,x,y:d.y,width:d.w,height:d.h,
          class:'color-icon',
          color:d.filled,
          style:`--delay:${(d.phase+i*0.29).toFixed(3)}s`
        });
        if(frac<1){
          // 在图标自身的边界内裁切精确的小数比例（3号房屋6%，4号小人91%）。
          // clip-path: inset 使用 fill-box，相比外部 SVG clipPath 跨浏览器更稳定。
          overlay.setAttribute('style',
            overlay.getAttribute('style') + `;clip-path:inset(0 ${(100*(1-frac)).toFixed(2)}% 0 0)`);

        }
        d.group.append(overlay);
      }
    }
  });
  const compact=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let scheduled=[];
  let current=0;
  let frame=0;
  function animateNumber(node,value,duration,token){
    const begin=performance.now();
    function tick(time){
      if(token!==current)return;
      const k=Math.min(1,(time-begin)/duration);
      // easeOutCubic
      const eased=1-Math.pow(1-k,3);
      node.textContent=(value*eased).toFixed(1)+'%';
      if(k<1)frame=requestAnimationFrame(tick);
      else node.textContent=value.toFixed(1)+'%';
    }
    frame=requestAnimationFrame(tick);
  }
  function play(){
    current++;
    const token=current;
    scheduled.forEach(clearTimeout);
    scheduled=[];
    cancelAnimationFrame(frame);
    stage.classList.remove('playing');
    // 刷新动画状态，确保重复移入/点击可以从头播放。
    void stage.offsetWidth;
    topNumber.textContent='20.6%';
    bottomNumber.textContent='39.1%';
    stage.classList.add('playing');
    if(compact)return;
    scheduled.push(setTimeout(()=>animateNumber(topNumber,20.6,850,token),4310));
    scheduled.push(setTimeout(()=>animateNumber(bottomNumber,39.1,850,token),4660));
  }
  stage.addEventListener('pointerenter',e=>{
    if(e.pointerType==='mouse')play();
  });
  stage.addEventListener('pointerdown',e=>{
    if(e.pointerType!=='mouse')play();
    else play();
  });
  stage.addEventListener('keydown',e=>{
    if(e.key==='Enter'||e.key===' '){e.preventDefault();play();}
  });
  // 若从 Readymag iframe 进入时指针恰好位于其内部，也可以点击重播。
  const params=new URLSearchParams(location.search);
  if(params.get('theme')==='light')document.documentElement.dataset.theme='light';
  if(params.get('autoplay')==='1')play();
})();
</script>
</body>
</html>
